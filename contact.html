<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Me</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #f3efff; padding: 30px 20px; color: #333; }
  h1 { text-align: center; color: #6a1b9a; font-size: 32px; margin-bottom: 5px; }
  p { text-align: center; margin-bottom: 25px; color: #666; }
  .box {
    background: white;
    max-width: 400px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }
  .info { margin-bottom: 15px; font-size: 16px; }
  .info b { color: #6a1b9a; }
  .info a { color: #333; text-decoration: none; }
  input, textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
  }
  input:focus, textarea:focus { border-color: #9c27b0; }
  textarea { height: 110px; resize: none; }
  button {
    width: 100%;
    background: #8e24aa;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
  }
  .back { display: block; text-align: center; margin-top: 15px; color: #6a1b9a; text-decoration: none; }
</style>
</head>
<body>

<h1>Contact Me</h1>
<p>Let's talk!</p>

<div class="box">
  <div class="info"><b>Email:</b> <a href="mailto:shahinaa0302@gmail.com">shahinaa0302@gmail.com</a></div>
  

  <br>
  <input type="text" placeholder="Your Name">
  <input type="email" placeholder="Your Email">
  <textarea placeholder="Your Message"></textarea>
  <button>Send Message</button>

  <a href="Index.html" class="back">Back to Home</a>
</div>

</body>
</html>
